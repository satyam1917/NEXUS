<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS Care Workbench · Demo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="NEXUS Care Workbench — payer case-management prototype. Synthetic data, not for clinical use.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="demo-banner" role="note" id="demo-banner">DEMO ENVIRONMENT • SYNTHETIC DATA • NOT FOR CLINICAL USE</div>
<header class="topbar" id="topbar"></header>
<main id="view" tabindex="-1"><p class="muted">Loading workbook data…</p></main>
<button class="copilot-edge" id="copilot-edge" data-act="copilot-open" aria-controls="copilot" aria-expanded="false"></button>
<aside class="drawer" id="copilot" aria-label="NEXUS Copilot" aria-hidden="true"></aside>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">NEXUS needs JavaScript enabled.</p></noscript>
<script src="js/icons.js"></script>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
